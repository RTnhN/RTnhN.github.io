---
layout: page
title: Notes
permalink: /notes/
---

<div class="notes" id="notes">
  <div class="notes-controls">
    <input type="search" id="notes-search" placeholder="Search notes…" aria-label="Search notes" />
    <select id="notes-sort" aria-label="Sort notes">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
    </select>
    <a class="notes-rss" href="{{ site.baseurl }}/feed/notes.xml" title="Subscribe to notes (RSS)">RSS</a>
  </div>

  <p class="notes-empty" id="notes-empty" hidden>No notes match.</p>

  <div id="notes-list">
    {% assign notes = site.notes | sort: "date" | reverse %}
    {% for note in notes %}
      {% include note-card.html note=note link=true %}
    {% else %}
      <p class="notes-empty">No notes yet.</p>
    {% endfor %}
  </div>

  <button type="button" class="notes-more" id="notes-more" hidden>Load more</button>
</div>

<script src="{{ site.baseurl }}/assets/notes.js" defer></script>
